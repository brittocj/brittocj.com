<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" fill="url(#bgGrad)" rx="16"/>

  <!-- Title -->
  <text x="500" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#f1f5f9">Entropy: From Order to Disorder</text>
  <text x="500" y="76" text-anchor="middle" font-size="14" fill="#94a3b8">The Second Law of Thermodynamics - The Arrow of Time</text>

  <!-- Left panel: Low Entropy (Order) -->
  <rect x="60" y="110" width="380" height="300" rx="12" fill="#1a2234" stroke="rgba(59,130,246,0.3)" stroke-width="1.5"/>
  <text x="210" y="140" text-anchor="middle" font-size="16" font-weight="600" fill="#60a5fa">LOW ENTROPY (ORDER)</text>
  <text x="210" y="162" text-anchor="middle" font-size="12" fill="#94a3b8">Early universe - highly ordered state</text>

  <!-- Ordered grid of particles -->
  <g fill="#3b82f6" opacity="0.9">
    <circle cx="120" cy="200" r="10"/>
    <circle cx="160" cy="200" r="10"/>
    <circle cx="200" cy="200" r="10"/>
    <circle cx="240" cy="200" r="10"/>
    <circle cx="280" cy="200" r="10"/>
    <circle cx="320" cy="200" r="10"/>
    <circle cx="120" cy="240" r="10"/>
    <circle cx="160" cy="240" r="10"/>
    <circle cx="200" cy="240" r="10"/>
    <circle cx="240" cy="240" r="10"/>
    <circle cx="280" cy="240" r="10"/>
    <circle cx="320" cy="240" r="10"/>
    <circle cx="120" cy="280" r="10"/>
    <circle cx="160" cy="280" r="10"/>
    <circle cx="200" cy="280" r="10"/>
    <circle cx="240" cy="280" r="10"/>
    <circle cx="280" cy="280" r="10"/>
    <circle cx="320" cy="280" r="10"/>
    <circle cx="120" cy="320" r="10"/>
    <circle cx="160" cy="320" r="10"/>
    <circle cx="200" cy="320" r="10"/>
    <circle cx="240" cy="320" r="10"/>
    <circle cx="280" cy="320" r="10"/>
    <circle cx="320" cy="320" r="10"/>
  </g>

  <!-- Right panel: High Entropy (Disorder) -->
  <rect x="640" y="110" width="300" height="300" rx="12" fill="rgba(26,34,60,0.6)" stroke="rgba(248,113,113,0.3)" stroke-width="1.5"/>
  <text x="790" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#f87171">HIGH ENTROPY (DISORDER)</text>
  <text x="790" y="162" text-anchor="middle" font-size="12" fill="#94a3b8">Heat death - maximum disorder</text>

  <!-- Scattered particles -->
  <g fill="#f87171" opacity="0.85">
    <circle cx="680" cy="200" r="8"/>
    <circle cx="730" cy="190" r="12"/>
    <circle cx="790" cy="210" r="7"/>
    <circle cx="850" cy="195" r="10"/>
    <circle cx="900" cy="205" r="9"/>
    <circle cx="700" cy="250" r="11"/>
    <circle cx="760" cy="240" r="8"/>
    <circle cx="820" cy="255" r="13"/>
    <circle cx="880" cy="245" r="7"/>
    <circle cx="920" cy="260" r="10"/>
    <circle cx="670" cy="300" r="9"/>
    <circle cx="740" cy="310" r="10"/>
    <circle cx="800" cy="295" r="8"/>
    <circle cx="860" cy="315" r="11"/>
    <circle cx="910" cy="300" r="7"/>
    <circle cx="690" cy="350" r="12"/>
    <circle cx="750" cy="360" r="7"/>
    <circle cx="830" cy="345" r="10"/>
    <circle cx="890" cy="355" r="9"/>
    <circle cx="940" cy="340" r="8"/>
  </g>

  <!-- Arrow of time -->
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="url(#arrowGrad)"/>
    </marker>
  </defs>
  <line x1="390" y1="260" x2="610" y2="260" stroke="url(#arrowGrad)" stroke-width="4" marker-end="url(#arrowhead)" filter="url(#glow)"/>
  <text x="500" y="245" text-anchor="middle" font-size="13" font-weight="600" fill="#f1f5f9">TIME</text>
  <text x="500" y="290" text-anchor="middle" font-size="12" fill="#94a3b8">Entropy increases</text>

  <!-- Bottom labels -->
  <text x="210" y="440" text-anchor="middle" font-size="12" fill="#60a5fa">Ordered energy available for work</text>
  <text x="740" y="440" text-anchor="middle" font-size="12" fill="#f87171">Energy dispersed - no work possible</text>

  <!-- Bottom bar -->
  <rect x="60" y="465" width="880" height="3" rx="1.5" fill="url(#accentGrad)" opacity="0.6"/>
  <text x="500" y="490" text-anchor="middle" font-size="11" fill="#64748b">The universe cannot reverse this arrow from within - it requires an external, non-entropic source</text>
</svg>